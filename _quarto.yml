project:
  type: website
  output-dir: _site

website:
  title: "Felipe Montealegre Mora, PhD"
  description: "Academic portfolio and professional website"
  site-url: "https://felimomo.github.io/quarto-website"
  navbar:
    background: "#102a43"
    foreground: "#f7fafc"
    title: "Your Name"
    right:
      - text: "Intro"
        href: "#intro"
      - text: "Research"
        href: "#research"
      - text: "Publications"
        href: "#publications"
      - text: "Teaching"
        href: "#teaching"
      - text: "Music"
        href: "#music"
      - icon: github
        href: "https://github.com/felimomo"
        aria-label: "GitHub"
  page-footer:
    left: "(c) 2026 Felipe Montealegre. Created with the Copilot CLI."
    right:
      - icon: envelope
        href: "mailto:felipe.montealegre@ucr.ac.cr"
        aria-label: "Email"

format:
  html:
    theme: none
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
